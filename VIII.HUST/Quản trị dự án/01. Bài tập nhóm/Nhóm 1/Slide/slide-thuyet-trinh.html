<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nhóm 1 — Hệ thống quản lý hàng hóa và kho bãi sản phẩm thời trang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800&amp;display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #C81028; --red-d: #9D1D1F; --gold: #F0C008;
      --ink: #1A1A1A; --muted: #5C5C5C; --line: #E8D9DC;
      --paper: #FDFAFB; --card: #fff; --ok: #1f7a4d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    body { font-family: "Be Vietnam Pro", "Segoe UI", sans-serif; color: var(--ink); }
    #stage { width: 100vw; height: 100vh; display: grid; place-items: center; }
    #canvas { width: 1920px; height: 1080px; position: relative; transform-origin: center center; background: var(--paper); }
    .slide {
      position: absolute; inset: 0; display: none;
      flex-direction: column; padding: 36px 52px 54px; gap: 12px;
      background: var(--paper);
    }
    .slide.on { display: flex; }
    .slide.cover, .slide.end { padding: 0; gap: 0; }
    .kicker { font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
    h2 { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.12; }
    p, li { font-size: 16px; line-height: 1.32; }
    .muted { color: var(--muted); }
    .bar { display: flex; align-items: flex-end; gap: 20px; flex: 0 0 auto; }
    .bar .rule { flex: 1; height: 3px; margin-bottom: 8px; background: linear-gradient(90deg, var(--red), var(--gold) 60%, transparent); }
    .fill { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
    .fill > * { flex: 1 1 0; min-height: 0; }
    .fill > table { flex: 1.5 1 0; }
    .fill > .g3 { flex: 0.4 1 0; }
    .fill > .g4, .fill > .g5 { flex: 0.26 1 0; }
    .fill > .short { flex: 0.4 1 0 !important; }
    .fill.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fill.g2 > * { flex: unset; height: 100%; }
    .g2, .g3, .g4, .g5, .g6 { align-items: stretch; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .g5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .g6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    .g2 > .card, .g3 > .card, .g4 > .card { height: 100%; }
    .tight { flex: 0 0 auto !important; }
    .grow { flex: 1 1 0; min-height: 0; }
    .scope > .card { justify-content: flex-start; }
    .scope > .card > .g2 { flex: 1; align-content: stretch; grid-auto-rows: 1fr; }
    .card > .g2 { flex: 1; min-height: 0; grid-auto-rows: 1fr; }
    .card > .g3, .card > .g4, .card > .g5 { flex: 0.48; min-height: 0; grid-auto-rows: 1fr; }
    .card > table { flex: 1.4; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; display: flex; flex-direction: column; min-height: 0;
    }
    .card h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .num { font-size: 28px; font-weight: 800; color: var(--red); line-height: 1.05; }
    .tag { display: inline-flex; background: #f3e6e9; color: var(--red); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; width: fit-content; }
    .tag.gold { background: #FFF6CC; color: #7A5C00; }
    .tag.ok { background: #e5f4ea; color: var(--ok); }
    table { width: 100%; height: 100%; border-collapse: collapse; font-size: 16px; }
    th { text-align: left; background: var(--red); color: #fff; font-weight: 600; padding: 10px 12px; }
    td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:nth-child(even) td { background: #fbf8f8; }
    ul.clean { list-style: none; }
    ul.clean li { position: relative; padding-left: 16px; margin: 4px 0; }
    ul.clean li::before { content: ""; position: absolute; left: 0; top: 7px; width: 7px; height: 7px; background: var(--red); border-radius: 1px; }
    .foot {
      position: absolute; left: 52px; right: 52px; bottom: 14px;
      display: flex; justify-content: space-between; font-size: 13px; color: var(--muted);
      border-top: 1px solid var(--line); padding-top: 7px;
    }
    .foot b { color: var(--red); }
    .progress { position: absolute; left: 0; right: 0; top: 0; height: 5px; background: #eadfe1; z-index: 5; }
    .progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); }
    #hud { display: none !important; }
    .cover-bg { display: grid; grid-template-columns: 1.12fr .88fr; height: 100%; }
    .cover-l { background: var(--red); color: #fff; padding: 48px 56px 40px; display: flex; flex-direction: column; }
    .cover-r { background: var(--paper); padding: 48px 48px 40px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { width: 68px; height: 68px; }
    .brand .uni { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
    .brand .sch { font-size: 16px; font-weight: 700; }
    .cover-l h1 { font-size: 36px; margin-top: 24px; color: #fff; font-weight: 800; line-height: 1.18; }
    .cover-l .sub { margin-top: 12px; font-size: 17px; color: #FFE8EA; line-height: 1.35; }
    .meta-row { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .meta-row .lab { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
    .meta-row .val { font-size: 17px; font-weight: 700; margin-top: 4px; }
    .member { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); flex: 1; }
    .av { width: 40px; height: 40px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 12px; flex-shrink: 0; }
    .av.g { background: var(--gold); color: #1A1A1A; }
    .member .nm { font-weight: 700; font-size: 17px; }
    .member .role { font-size: 13px; color: var(--muted); }
    .end-bg { height: 100%; background: var(--red); color: #fff; display: flex; flex-direction: column; padding: 48px 60px 36px; }
    .end-bg > .g3 { flex: 0 0 auto; }
    .end-bg > .g2 { flex: 1; min-height: 0; margin-top: 14px; }
    .end-bg > .g2 > .card { height: 100%; }
    .end-bg h1 { color: #fff; font-size: 56px; font-weight: 800; }
    .q { font-size: 20px; color: var(--gold); margin-top: 6px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }

    /* diagrams */
    .flow { display: flex; align-items: stretch; gap: 0; flex: 1; min-height: 0; }
    .flow .st {
      flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 6px; text-align: center; min-width: 0; min-height: 0;
      display: flex; flex-direction: column; justify-content: center;
    }
    .flow .st b { display: block; color: var(--red); font-size: 12px; font-weight: 800; }
    .flow .st span { display: block; font-size: 15px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
    .flow .ar { flex: 0 0 22px; display: grid; place-items: center; color: var(--red); font-weight: 800; font-size: 18px; }
    .chip {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 12px; font-size: 16px; font-weight: 600; text-align: center;
      display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 0; height: 100%;
    }
    .chip em { font-style: normal; font-size: 13px; color: var(--muted); font-weight: 500; }
    .kpi {
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 10px; text-align: center; display: flex; flex-direction: column; justify-content: center;
      height: 100%;
    }
    .kpi .n { font-size: 30px; font-weight: 800; color: var(--red); line-height: 1; }
    .kpi .l { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 600; }
    .tree { display: flex; flex-direction: column; align-items: center; gap: 0; }
    .tree .node {
      background: var(--red); color: #fff; border-radius: 10px; padding: 8px 18px;
      font-weight: 700; font-size: 16px; text-align: center;
    }
    .tree .node.sub { background: #fff; color: var(--ink); border: 2px solid var(--red); }
    .tree .node.leaf { background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 8px 10px; min-width: 110px; }
    .tree .node.leaf b { display: block; color: var(--red); font-size: 18px; }
    .tree .vl { width: 2px; height: 14px; background: var(--red); }
    .tree .hl { height: 2px; background: var(--red); }
    .tree .row { display: flex; gap: 16px; width: 100%; justify-content: center; }
    .tree .col { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .hbar { height: 18px; background: #f3e6e9; border-radius: 6px; overflow: hidden; }
    .hbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), #e25a3a); border-radius: 6px; }
    .gantt { display: grid; grid-template-columns: 150px 1fr; gap: 8px 10px; align-items: center; flex: 1; align-content: space-evenly; }
    .gantt .track { position: relative; height: 36px; background: #f6eef0; border-radius: 6px; }
    .gantt .bar {
      position: absolute; top: 6px; height: 24px; border-radius: 5px;
      background: var(--red); color: #fff; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .gantt .months { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 12px; color: var(--muted); font-weight: 700; text-align: center; }
    .donut-wrap { display: flex; align-items: center; gap: 28px; }
    .donut {
      width: 280px; height: 280px; border-radius: 50%; flex-shrink: 0;
      background: conic-gradient(#C81028 0 69.9%, #9D1D1F 69.9% 88%, #F0C008 88% 100%);
      display: grid; place-items: center;
    }
    .donut > span {
      width: 148px; height: 148px; border-radius: 50%; background: var(--paper);
      display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 22px; line-height: 1.15;
    }
    .donut > span small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
    .legend { display: flex; flex-direction: column; gap: 10px; }
    .legend .it { display: flex; align-items: center; gap: 10px; font-size: 15px; }
    .sw { width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; }
    .org { display: flex; flex-direction: column; align-items: center; gap: 0; flex: 1; justify-content: space-evenly; width: 100%; }
    .bars { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 6px; min-height: 0; }
    .obox {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 14px; text-align: center; min-width: 160px;
    }
    .obox.pm { background: var(--red); color: #fff; border-color: var(--red); }
    .obox b { display: block; font-size: 14px; }
    .obox span { display: block; font-size: 12px; opacity: .85; }
    .ov { width: 2px; height: 14px; background: var(--red); }
    .oh { height: 2px; background: var(--red); width: 100%; }
    .arch { display: grid; gap: 8px; flex: 1; align-content: space-evenly; }
    .arch .ly {
      border-radius: 10px; padding: 10px 14px; text-align: center; font-weight: 700; font-size: 15px;
      display: flex; justify-content: center; gap: 18px; flex-wrap: wrap;
    }
    .arch .ly span { background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 8px; }
    .arch .ui { background: var(--red); color: #fff; }
    .arch .api { background: var(--red-d); color: #fff; }
    .arch .data { background: #7A5C00; color: #fff; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 15px; flex: 1; align-content: space-evenly; }
    .kv b { color: var(--muted); font-weight: 600; }
    .goal { text-align: center; padding: 16px 10px; height: 100%; justify-content: center; }
    .cover-r > .card { flex: 1.15; margin-top: 10px; }
    .cover-l > .g3 { flex: 1; align-content: stretch; }
    .cover-l > .g3 > .card { height: auto; }
    .goal .n { font-size: 28px; font-weight: 800; color: var(--red); }
    .goal p { font-size: 14px; margin-top: 6px; }
    .ms { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; position: relative; height: 100%; align-items: stretch; }
    .ms::before { content: ""; position: absolute; left: 8%; right: 8%; top: 18px; height: 3px; background: linear-gradient(90deg, var(--red), var(--gold)); }
    .ms .m {
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      padding: 28px 8px 10px; text-align: center; position: relative;
      display: flex; flex-direction: column; justify-content: center; height: 100%;
    }
    .ms .m i {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 16px; height: 16px; border-radius: 50%; background: var(--red);
      border: 3px solid #fff; box-shadow: 0 0 0 2px var(--red);
    }
    .ms .m b { display: block; font-size: 16px; }
    .ms .m span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ms .m p { font-size: 13px; margin-top: 4px; font-weight: 600; }
    .fromto { display: grid; grid-template-columns: 1fr 20px 1fr; gap: 4px 6px; align-items: stretch; }
    .fromto .a, .fromto .b { padding: 7px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; display: flex; align-items: center; }
    .fromto .a { background: #f8e9ec; color: var(--red-d); }
    .fromto .b { background: #e7f4ec; color: #145a38; }
    .fromto .x { display: grid; place-items: center; color: var(--gold); font-weight: 800; }
    .phase-bar { display: flex; height: 36px; border-radius: 8px; overflow: hidden; font-size: 12px; font-weight: 700; color: #fff; }
    .phase-bar > div { display: grid; place-items: center; }
  </style>
</head>

  <div id="stage"><div id="canvas"></div></div>
  <div id="hud"><button type="button" id="prev">‹</button><button type="button" id="next">›</button></div>

  <template id="slides">
    <!-- 1 -->

      <div class="cover-bg">
        <div class="cover-l">

          <h2 style="margin:8px 0 4px;">Thành viên</h2>

          <div class="member"><div class="av g">QL</div><div><div class="nm">Bùi Quốc Luýt · 202490069</div><div class="role">Trưởng nhóm kỹ thuật, Lập trình Back-end</div></div></div>
          <div class="member"><div class="av">QM</div><div><div class="nm">Vũ Quang Minh · 202490071</div><div class="role">Lập trình Back-end</div></div></div>
          <div class="member"><div class="av g">MQ</div><div><div class="nm">Bạch Minh Quang · 202490077</div><div class="role">Thiết kế UI/UX, Lập trình Front-end</div></div></div>
          <div class="member"><div class="av">BT</div><div><div class="nm">Phạm Đoàn Bảo Thiên · 202490090</div><div class="role">Thiết kế CSDL, Kiểm thử</div></div></div>
          <div class="card">
            <h3>Bộ hồ sơ · 5 tài liệu</h3>
            <div class="flow" style="margin-top:8px;">
              <div class="st"><b>1</b><span>Khảo sát</span></div><div class="ar">→</div>
              <div class="st"><b>2</b><span>PTTK</span></div><div class="ar">→</div>
              <div class="st"><b>3</b><span>WBS</span></div><div class="ar">→</div>

            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2 -->
    <section class="slide">
      <div class="bar"><div><div class="kicker">Bộ hồ sơ Nhóm 1</div><h2>Năm tài liệu và sáu chương PTTK</h2></div><div class="rule"></div></div>
      <div class="fill">
        <div class="g5" style="flex:0 0 auto;">
          <div class="kpi"><div class="n">19</div><div class="l">Yêu cầu chức năng</div></div>

          <div class="kpi"><div class="n">10</div><div class="l">Màn hình</div></div>
        </div>
        <table>
          <thead><tr><th style="width:8%">#</th><th style="width:34%">Tài liệu</th><th>Nội dung</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>Báo cáo khảo sát hiện trạng</td><td>Bối cảnh, quy trình kho, vấn đề khách hàng</td></tr>

        <div class="card">
          <h3>Báo cáo PTTK — 6 chương</h3>
          <div class="flow" style="margin-top:10px;">
            <div class="st"><b>Ch.1</b><span>Khảo sát hiện trạng</span></div><div class="ar">→</div>
            <div class="st"><b>Ch.2</b><span>Phân tích yêu cầu</span></div><div class="ar">→</div>
            <div class="st"><b>Ch.3</b><span>Phân tích</span></div><div class="ar">→</div>

  <script>
    const canvas = document.getElementById("canvas");
    document.getElementById("slides").content.querySelectorAll(".slide").forEach((s) => canvas.appendChild(s.cloneNode(true)));
    const slides = [...canvas.querySelectorAll(".slide")];
    let i = 0;
    const bar = document.getElementById("bar");
    function go(n) {
      i = (n + slides.length) % slides.length;
      slides.forEach((s, k) => s.classList.toggle("on", k === i));
      bar.style.width = ((i + 1) / slides.length * 100) + "%";
      history.replaceState(null, "", "#" + (i + 1));
    }
    function fit() {
      canvas.style.transform = "scale(" + Math.min(innerWidth / 1920, innerHeight / 1080) + ")";
    }
    addEventListener("resize", fit);
    addEventListener("keydown", (e) => {
      if (["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(e.key)) { e.preventDefault(); go(i + 1); }
      if (["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(e.key)) { e.preventDefault(); go(i - 1); }
      if (e.key === "Home") go(0);
      if (e.key === "End") go(slides.length - 1);
      if (e.key === "f" || e.key === "F") document.documentElement.requestFullscreen?.();
    });
    document.getElementById("next").onclick = () => go(i + 1);
    document.getElementById("prev").onclick = () => go(i - 1);
    canvas.addEventListener("click", (e) => {
      if (e.target.closest("a,button")) return;
      go(e.clientX > innerWidth / 2 ? i + 1 : i - 1);
    });
    fit();
    go(parseInt((location.hash || "#1").slice(1), 10) - 1 || 0);
  </script>
